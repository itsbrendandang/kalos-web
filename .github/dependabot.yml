version: 2
updates:
  # kalos-web's dependencies are locked in package-lock.json - this watches
  # both direct and transitive bumps that lockfile authorizes.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # react-dom requires the matching react, so a lone bump of either fails
      # `npm ci` (#33 and #34 did, separately). Move all four together.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # One weekly PR per ecosystem for minor + patch bumps; majors still arrive separately.
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Keeps the actions pinned in .github/workflows/ci.yml (checkout,
  # setup-node) current without a human remembering to check.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One weekly PR per ecosystem for minor + patch bumps; majors still arrive separately.
      minor-and-patch:
        update-types: ["minor", "patch"]
