name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 22.16.0 pinned to match the local dev environment: Next 16.2.9
      # requires Node >=20.9.0 and vitest 4 requires ^20 || ^22 || >=24, so
      # anything short of 22 silently fails the build/test steps below.
      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          cache: npm
      # npm ci, not npm install: the lockfile is authoritative, not whatever
      # a dev's local node_modules happens to resolve to.
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # `next build` IS the type-check gate here, and it has to be - there is no
      # separate `npx tsc --noEmit` step on purpose.
      #
      # Next 16 generates the global `PageProps` type into .next/types, so a bare
      # tsc run on a FRESH checkout fails with
      #   app/experiments/[id]/page.tsx: error TS2304: Cannot find name 'PageProps'
      # before any of the real code is checked. It passes on a dev machine only
      # because a stale .next from an earlier build is already sitting there,
      # which is precisely the false pass CI exists to catch - and this workflow
      # caught it on its own first run.
      #
      # `next build` generates those types and then runs TypeScript over the
      # project ("Running TypeScript ... Finished TypeScript" in its output), so
      # type errors still fail the build. A separate tsc step would be redundant
      # even if the ordering were fixed. Do not re-add one without moving it
      # after this step.
      - run: npm run build
      # This repo had zero CI before this workflow. Every one of the gates
      # above was previously verified only by hand on a laptop, including
      # through the 60-file shadcn migration.
